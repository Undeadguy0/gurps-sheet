[package]
name = "gurps-sheet-app"
description = "GURPS 4e character editor (Tauri v2 shell)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gurps_sheet_app"
path = "src/lib.rs"

[[bin]]
name = "gurps-sheet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
gurps-core.workspace = true
gurps-dice.workspace = true
gurps-library.workspace = true
gurps-io.workspace = true

[dev-dependencies]
# Тесты состояния - на тестовой БД (testkit: `surreal` + сиды gurps-mcp).
gurps-db = { workspace = true, features = ["testkit"] }
tokio = { version = "1", features = ["rt"] }
