A heavier fighting knife: a better stab and a usable slash, still parrying at a penalty.
'''

[[weapons]]
id = "punch"
name = "Punch"
skill = "brawling"
page = "B271" # unverified
attacks = [
  { mode = "punch", damage = "thr-1", damage_type = "cr", reach = "C", parry = 0, defaults = [{ attribute = "DX", modifier = 0 }], skill_damage_bonus = { min_relative = 2, per_die = 1 } },
]
description = '''
A blow with the fist. Uses Brawling if known, otherwise plain DX. Very good brawlers (DX+2 or better) hit harder: +1 damage per die.
'''

[[weapons]]
id = "kick"
name = "Kick"
skill = "brawling"
page = "B271" # unverified
attacks = [
  { mode = "kick", damage = "thr", damage_type = "cr", reach = "C,1", skill_modifier = -2, technique = "kicking", defaults = [{ attribute = "DX", modifier = -2 }], skill_damage_bonus = { min_relative = 2, per_die = 1 } },
]
description = '''
A blow with the foot: harder than a punch but cannot be used to parry. Uses the Kicking technique if bought, otherwise Brawling-2 or DX-2. The Brawling damage bonus applies here too.
'''
