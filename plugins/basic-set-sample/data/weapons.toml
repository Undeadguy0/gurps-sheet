# Sample weapons: attack modes, damage expressions, reach and parry modifiers.
# `equipment` links a weapon to an equipment id: it appears on the sheet while that item
# is owned. Unarmed attacks have no link. Descriptions are our own words.
# Stats are from memory and UNVERIFIED.

[[weapons]]
id = "broadsword"
name = "Broadsword"
equipment = "broadsword"
skill = "broadsword"
page = "B271" # unverified
attacks = [
  { mode = "swing", damage = "sw+1", damage_type = "cut", reach = "1", parry = 0, defaults = [{ attribute = "DX", modifier = -5 }] },
  { mode = "thrust", damage = "thr+1", damage_type = "cr", reach = "1", parry = 0, defaults = [{ attribute = "DX", modifier = -5 }] },
]
description = '''
A balanced one-handed sword: a cutting swing or a blunt-tipped thrust, both at arm's reach. It parries without penalty.
'''

[[weapons]]
id = "small-knife"
name = "Small Knife"
equipment = "small-knife"
skill = "knife"
page = "B272" # unverified
attacks = [
  { mode = "thrust", damage = "thr-1", damage_type = "imp", reach = "C,1", parry = -1, defaults = [{ attribute = "DX", modifier = -4 }] },
  { mode = "swing", damage = "sw-3", damage_type = "cut", reach = "C,1", parry = -1, defaults = [{ attribute = "DX", modifier = -4 }] },
]
description = '''
A short blade for stabbing at close range or slashing at a short reach. Being so small, it parries at a penalty.
'''

[[weapons]]
id = "large-knife"
