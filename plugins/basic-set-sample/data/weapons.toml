skill = "knife"
page = "B272" # unverified
attacks = [
  { mode = "thrust", damage = "thr", damage_type = "imp", reach = "C", parry = -1, defaults = [{ attribute = "DX", modifier = -4 }] },
  { mode = "swing", damage = "sw-2", damage_type = "cut", reach = "C,1", parry = -1, defaults = [{ attribute = "DX", modifier = -4 }] },
]
