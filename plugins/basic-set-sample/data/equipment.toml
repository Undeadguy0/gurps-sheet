# Sample equipment: weight per unit in lb, cost per unit in $.
# `description` texts are our own words (Markdown), not book text.
# Weights, costs and page references are from memory and UNVERIFIED.

[[equipment]]
id = "broadsword"
name = "Broadsword"
weight = 3.0
cost = 500.0
page = "B271" # unverified
description = '''
A one-handed sword of about arm's length, balanced for both cutting and thrusting. A common sidearm for soldiers and the main weapon of many knights.

Use it with the Broadsword skill. Owning it adds its attacks to the weapons table.
'''

[[equipment]]
id = "small-knife"
name = "Small Knife"
weight = 0.5
cost = 30.0
page = "B272" # unverified
description = '''
A short, light blade for everyday work: cutting rope, preparing food, whittling. In a pinch it is a weapon too, and it is small enough to hide or throw.

Cheap and almost weightless, so many characters carry more than one. Set the quantity instead of adding separate rows.
'''

[[equipment]]
id = "large-knife"
name = "Large Knife"
weight = 1.0
cost = 40.0
page = "B272" # unverified
description = '''
A long knife or short fighting blade, heavier than a utility knife and better suited to combat. Hunters and soldiers often wear one on the belt.

Used with the Knife skill. Owning it adds its attacks to the weapons table.
'''

[[equipment]]
id = "small-shield"
name = "Small Shield"
weight = 8.0
cost = 40.0
stats = "DB 1"
page = "B287" # unverified
description = '''
A light round or square shield strapped to the forearm. It gives a modest bonus to defences and leaves the hand fairly free.

The defence bonus is noted in the stats column; it will be applied to Parry, Block and Dodge with the defences stage.
'''

[[equipment]]
id = "medium-shield"
name = "Medium Shield"
weight = 15.0
cost = 60.0
stats = "DB 2"
page = "B287" # unverified
description = '''
The typical warrior's shield, large enough to cover much of the body. It gives a solid bonus to all active defences against attacks from the front.

It is fairly heavy, which matters for encumbrance. Its DB is shown with the defences while it is carried.
'''

[[equipment]]
id = "mail-shirt"
name = "Mail Shirt"
weight = 16.0
cost = 150.0
stats = "DR 4/2*"
page = "B283" # unverified
description = '''
A shirt of interlocking metal rings covering the torso. It stops cuts well but is less effective against crushing blows, which the asterisk in its protection value reminds you of.

A common choice for soldiers who need protection without full armour. Worn armour is still carried weight.
'''

[[equipment]]
id = "leather-jacket"
name = "Leather Jacket"
weight = 4.0
cost = 50.0
stats = "DR 1"
page = "B283" # unverified
description = '''
A heavy jacket of thick leather. It offers light protection and draws little attention, so it suits people who want some armour in town.

Light enough that it rarely changes encumbrance on its own.
'''

[[equipment]]
id = "backpack-frame"
name = "Backpack, Frame"
weight = 10.0
cost = 100.0
container = true
page = "B288" # unverified
description = '''
A large pack on a rigid frame for long journeys. It holds a lot of gear and spreads the load, but is itself fairly heavy.

It is a container: add items into it with the + button on its row. If you mark the pack as not carried, everything inside stops counting towards encumbrance as well.
'''

[[equipment]]
id = "backpack-small"
name = "Backpack, Small"
weight = 3.0
cost = 60.0
container = true
page = "B288" # unverified
description = '''
A simple shoulder pack for a day's worth of supplies. Lighter and cheaper than a frame pack, but holds much less.

It is a container: items inside count towards encumbrance only while the pack is carried.
'''

[[equipment]]
id = "personal-basics"
name = "Personal Basics"
weight = 1.0
cost = 5.0
page = "B288" # unverified
description = '''
A small kit of everyday necessities: something to eat with, basic grooming items, a way to make fire and similar odds and ends.

Without it, the GM may impose small penalties on survival and everyday tasks. It is cheap and light, so most travellers simply carry one.
'''

[[equipment]]
id = "rope-10yd"
name = "Rope, 10 yards"
weight = 1.5
cost = 5.0
page = "B288" # unverified
description = '''
A coil of ordinary rope, strong enough to hold one person. Useful for climbing, tying things up and countless improvised tasks.

Buy several if the party expects long descents; set the quantity rather than adding rows.
'''

[[equipment]]
id = "torch"
name = "Torch"
weight = 1.0
cost = 3.0
page = "B288" # unverified
description = '''
A stick wrapped in pitch-soaked cloth that burns for about an hour, giving light and a little warmth. It can also be waved at animals.

One hand is busy while it is held. Carry spares for long underground trips.
'''
