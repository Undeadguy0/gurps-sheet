# Sample skills and techniques: ids, attributes, difficulties, defaults and page refs.
# `description` texts are our own words (Markdown), not book text.
# Page references are from memory and UNVERIFIED.

[[skills]]
id = "broadsword"
name = "Broadsword"
attribute = "DX"
difficulty = "A"
page = "B208" # unverified
defaults = [{ attribute = "DX", modifier = -5 }, { skill = "shortsword", modifier = -2 }]
description = '''
Fighting with a balanced one-handed blade of roughly arm's length: arming swords, sabres, heavy batons and similar weapons. The skill covers attacking, parrying and the footwork that goes with them.

It is the bread-and-butter weapon skill of knights, guards and adventurers. Untrained people can still swing a sword at a heavy penalty, and anyone who knows a related blade skill does noticeably better than a complete novice.
'''

[[skills]]
id = "shield"
name = "Shield"
attribute = "DX"
difficulty = "E"
page = "B220" # unverified
defaults = [{ attribute = "DX", modifier = -4 }]
description = '''
Using a shield to block blows and missiles, and to keep it between yourself and the enemy while you fight with the other hand. Higher skill means more reliable blocks.

Any fighter who carries a shield should have at least a point or two here. The shield's own Defence Bonus comes from the equipment: the sheet shows Block from this skill and the DB of a carried shield.
'''

[[skills]]
id = "brawling"
name = "Brawling"
attribute = "DX"
difficulty = "E"
page = "B182" # unverified
defaults = []
description = '''
Rough, untrained-looking but effective unarmed fighting: punches, elbows, headbutts and dirty tricks learned in taverns, alleys and barracks. It improves hitting with bare hands and parrying without a weapon.

It is cheap and useful for almost anyone who might end up in a scuffle. Very skilled brawlers also hit harder: at DX+2 or better the sheet adds +1 damage per die to punches and kicks.
'''

[[skills]]
id = "knife"
name = "Knife"
attribute = "DX"
difficulty = "E"
page = "B208" # unverified
defaults = [{ attribute = "DX", modifier = -4 }]
description = '''
Fighting with a short blade held in the hand: daggers, knives and similar. The skill covers quick stabs and slashes at close range and parrying with the blade, which is harder than with a longer weapon.

Thieves, sailors, assassins and anyone who carries a knife for work or self-defence tend to know it. Throwing a knife is a separate skill.
'''

[[skills]]
id = "survival"
name = "Survival"
attribute = "Per"
difficulty = "A"
page = "B223" # unverified
defaults = [{ attribute = "Per", modifier = -5 }, { skill = "naturalist", modifier = -3 }]
specialization_required = true
specializations = ["Woodlands", "Desert", "Mountain", "Arctic", "Jungle", "Plains", "Swampland", "Island/Beach"]
description = '''
Living off the land in one kind of terrain: finding water and food, building a shelter, making fire and avoiding natural dangers. You must pick the terrain, such as woodlands, desert or mountains, and the skill is much weaker elsewhere.

Scouts, hunters, rangers and castaways rely on it. Write the terrain in the specialization field, for example Woodlands.
'''

[[skills]]
id = "tracking"
name = "Tracking"
attribute = "Per"
difficulty = "A"
page = "B226" # unverified
defaults = [{ attribute = "Per", modifier = -5 }, { skill = "naturalist", modifier = -5 }]
description = '''
Following the trail of people or animals by reading footprints, broken twigs, disturbed ground and similar signs. Fresh, clear trails are easy; old, rained-on or deliberately hidden ones are much harder.

Hunters, scouts and bounty hunters use it constantly. A quarry that knows how to hide its tracks can make the job considerably more difficult.
'''

[[skills]]
id = "stealth"
name = "Stealth"
attribute = "DX"
difficulty = "A"
page = "B222" # unverified
defaults = [{ attribute = "DX", modifier = -5 }, { attribute = "IQ", modifier = -5 }]
description = '''
Moving quietly and staying out of sight: sneaking past guards, hiding in shadows, following someone without being noticed. Heavy loads and noisy armour make it harder.

Almost every thief, scout and spy needs it. Anyone can try to sneak at default, but trained characters are far more reliable.
'''

[[skills]]
id = "climbing"
name = "Climbing"
attribute = "DX"
difficulty = "A"
page = "B183" # unverified
defaults = [{ attribute = "DX", modifier = -5 }]
description = '''
Climbing trees, walls, cliffs and ropes, and knowing how to pick a safe route. Easy climbs with good holds need only occasional rolls; sheer or slippery surfaces are much harder.

Burglars, mountaineers, sailors and scouts find it valuable. A heavy load slows climbing down and makes falls more likely.
'''

[[skills]]
id = "first-aid"
name = "First Aid"
attribute = "IQ"
difficulty = "E"
page = "B195" # unverified
defaults = [{ attribute = "IQ", modifier = -4 }]
description = '''
Basic emergency care: stopping bleeding, bandaging wounds, treating shock and keeping someone alive until real medical help arrives. It restores a little lost health right after an injury.

Useful for every adventuring group; one character with this skill can make a big difference after a fight. It is not a replacement for a trained physician.
'''

[[skills]]
id = "swimming"
name = "Swimming"
attribute = "HT"
difficulty = "E"
page = "B224" # unverified
defaults = [{ attribute = "HT", modifier = -4 }]
description = '''
Staying afloat and moving through water, including diving in and rescuing someone who is drowning. Calm water is easy; currents, waves, cold and heavy gear make it dangerous.

Sailors, river folk and anyone who travels by boat should consider it. Armour and a full pack can make even a good swimmer sink.
'''

[[skills]]
id = "naturalist"
name = "Naturalist"
attribute = "IQ"
difficulty = "H"
page = "B211" # unverified
defaults = [{ attribute = "IQ", modifier = -6 }]
description = '''
Practical knowledge of the living world: which plants are edible or poisonous, how animals behave, how to read the weather and the seasons. It is broader and more theoretical than survival in one terrain.

Druids, hunters, herbalists and explorers benefit from it. Several outdoor skills can fall back on it when the character has no direct training.
'''

[[techniques]]
id = "kicking"
name = "Kicking"
skill = "brawling"
difficulty = "H"
modifier = -2
max = 0
page = "B231" # unverified
description = '''
A trained kick: a strong blow with the foot that hits harder than a punch but is riskier, since a miss can leave you off balance. It starts from your unarmed skill at a penalty and can be bought up to that skill's level.

Brawlers and martial artists like it as a heavy hitting option. The Kick attack in the weapons table uses this level when the technique is bought.
'''

[[techniques]]
id = "off-hand-weapon-training"
name = "Off-Hand Weapon Training"
skill = "broadsword"
difficulty = "H"
modifier = -4
max = 0
page = "B232" # unverified
description = '''
Practice with a weapon in the off hand, which normally suffers a heavy penalty. Each level removes part of that penalty, up to fighting as well with the off hand as with the main one.

Two-weapon fighters and duellists who expect to lose the use of their good arm buy it. Take it separately for each weapon skill.
'''
