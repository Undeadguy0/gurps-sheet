# Sample data only: names, point costs and page references.
# No rules text is reproduced here; see the GURPS Basic Set for the actual rules.
# `description` fields are summaries in our own words (Markdown), not book text.
# Translations live in Fluent files (see plugins/lang-ru).
# Page references are from memory and UNVERIFIED.

[[traits]]
id = "lifting-st"
name = "Lifting ST"
category = "advantage"
cost_per_level = 3
page = "B65"
features = [{ type = "lifting_st_bonus", amount = 1, per_level = true }]
description = '''
Extra muscle that only counts when you lift, carry, push or drag something. Each level raises the ST used to work out Basic Lift, so the character can haul heavier loads before being slowed down. It does not make blows hit harder and does not add Hit Points.

In play it suits porters, labourers, climbers who carry gear and anyone who needs to move a lot of weight cheaply. Combine it with ordinary ST if you also want stronger attacks.
'''

[[traits]]
id = "increased-st-example"
name = "Increased ST (example)"
category = "advantage"
cost_per_level = 10
page = "example"
features = [{ type = "attribute_bonus", target = "ST", amount = 1, per_level = true }]
description = '''
A sample trait used to test the sheet: each level simply adds +1 to ST, and everything calculated from ST follows automatically (Hit Points, Basic Lift, thrust and swing damage).

Use it to see how the sheet explains where a number comes from: the ST row will list the trait as a separate contribution next to the purchased levels.
'''

[[traits]]
id = "combat-reflexes"
name = "Combat Reflexes"
category = "advantage"
cost = 15
page = "B43"
description = '''
The character reacts to danger almost instantly. Surprise rarely freezes them, they recover from being stunned faster than most, and they are a little better at dodging, blocking and parrying. Fear and shock also have a weaker grip on them.

In play this is the classic trait of veterans, bodyguards and duellists: they act first in an ambush and keep their head when things go wrong. The defence and fear bonuses are not calculated by the sheet yet; apply them at the table.
'''

[[traits]]
id = "charisma"
name = "Charisma"
category = "advantage"
cost_per_level = 5
max_levels = 5
page = "B41"
description = '''
A natural magnetism that makes people want to listen and follow. Each level gives a bonus when others react to the character and helps with persuading, leading, performing and similar social efforts.

Typical for leaders, preachers, diplomats and con artists. It is about presence, not looks: a plain person can still be highly charismatic.
'''

[[traits]]
id = "acute-vision"
name = "Acute Vision"
category = "advantage"
cost_per_level = 2
page = "B35"
description = '''
Sharper eyesight than normal. Each level adds a bonus to rolls for noticing things by sight: spotting a hidden figure, reading a distant sign, catching a small movement.

Great for scouts, archers, lookouts and investigators. It improves only vision, not hearing or other senses.
'''

[[traits]]
id = "overconfidence"
name = "Overconfidence"
category = "disadvantage"
cost = -5
page = "B148"
description = '''
The character believes they can handle anything and consistently underestimates risk. When a sensible person would back off, plan or ask for help, they tend to charge ahead instead, unless they manage to resist the urge.

It makes for bold, memorable characters (young heroes, braggarts, star pilots), but the player should actually play the recklessness. Others may find them inspiring or insufferable.
'''

[[traits]]
id = "quirk-example"
name = "Quirk (example)"
category = "quirk"
cost = -1
page = "B162"
description = '''
A sample quirk: a small personal habit or preference worth a single point, such as always humming while working or refusing to eat fish.

Quirks add colour rather than real handicaps. Describe the concrete habit in your own explanation for this entry.
'''

# --- Added for golden test characters (examples/test-chars). ---
# NOTE: page references below are from memory and UNVERIFIED against the book.

[[traits]]
id = "high-pain-threshold"
name = "High Pain Threshold"
category = "advantage"
cost = 10
page = "B59" # unverified
description = '''
Pain bothers the character much less than it should. Wounds do not throw off their aim or concentration the way they would for others, and they are hard to break through pain, for example under torture.

Perfect for brawlers, soldiers and stoic heroes who keep fighting while bleeding. The reduced penalties are applied at the table; the sheet does not model them.
'''

[[traits]]
id = "striking-st"
name = "Striking ST"
category = "advantage"
cost_per_level = 5
page = "B88" # unverified
features = [{ type = "striking_st_bonus", amount = 1, per_level = true }]
description = '''
Extra strength that only counts for hitting things. Each level raises the ST used for thrust and swing damage, so blows land harder, but it does not help with lifting and does not add Hit Points.

Good for martial artists, monsters with powerful jaws or claws, and anyone whose attacks are stronger than their general build. The sheet adds it to the damage calculation automatically.
'''

[[traits]]
id = "magery"
name = "Magery"
category = "advantage"
cost = 5
cost_per_level = 10
min_levels = 0
page = "B66" # unverified
description = '''
An inborn talent for magic. Level 0 means the character can sense magic and learn spells at all; each further level makes spellcasting easier and opens access to more demanding spells.

It is the foundation of any wizard, witch or hedge mage. Even level 0 is useful for noticing enchanted items. Remember that magic may not exist or may work differently in your campaign setting.
'''

[[traits]]
id = "eidetic-memory"
name = "Eidetic Memory"
category = "advantage"
cost = 5
page = "B51" # unverified
description = '''
An excellent memory for details. The character easily recalls things they have seen, read or heard, and learning facts comes more naturally to them.

Ideal for scholars, detectives and spies. The GM may simply give the player reminders of past details that the character would remember.
'''

[[traits]]
id = "danger-sense"
name = "Danger Sense"
category = "advantage"
cost = 15
page = "B47" # unverified
description = '''
A sixth sense that warns the character just before something bad happens: an ambush, a trap, a collapsing floor. The GM rolls secretly, and on a success the character gets a vague feeling that something is wrong.

It is not prophecy: it gives no details, only a moment to react. Handy for adventurers who walk into ruins and dark alleys.
'''

[[traits]]
id = "bad-temper-12"
name = "Bad Temper (12)"
category = "disadvantage"
cost = -10
page = "B124" # unverified
description = '''
The character loses their temper easily. Under stress, insults or frustration they must make a self-control roll (12 or less here) or snap: shouting, insulting, sometimes throwing a punch.

Play it as a real flaw: angry outbursts can ruin negotiations and friendships. The number in brackets shows how often the character manages to stay calm.
'''

[[traits]]
id = "honesty-12"
name = "Honesty (12)"
category = "disadvantage"
cost = -10
page = "B138" # unverified
description = '''
The character respects law and fair play and feels deeply uncomfortable breaking rules or lying. When tempted to cheat, steal or deceive, they need a self-control roll (12 or less) to go through with it.

It does not make them naive or a snitch, just principled. Great source of drama in a party of rogues.
'''

[[traits]]
id = "overconfidence-12"
name = "Overconfidence (12)"
category = "disadvantage"
cost = -5
page = "B148" # unverified
description = '''
The same flaw as Overconfidence, with a self-control number of 12: the character can rein in their boldness fairly often, but not always.

When a risky situation comes up, roll against 12; on a failure they act as if success were guaranteed. Describe how this shows up for your character in your own explanation.
'''

[[traits]]
id = "pacifism-self-defense"
name = "Pacifism: Self-Defense Only"
category = "disadvantage"
cost = -15
page = "B148" # unverified
description = '''
The character refuses to start violence and fights only to protect themselves or others who are under attack. Once the threat is stopped, they will not pursue or finish off an enemy.

Fits healers, monks and idealists. The party should be ready for situations where this character will not strike first, even when it would be convenient.
'''

[[traits]]
id = "curious-12"
name = "Curious (12)"
category = "disadvantage"
cost = -5
page = "B129" # unverified
description = '''
The character cannot leave a mystery alone: strange buttons get pressed, sealed doors get opened, odd noises get investigated. Resisting the urge takes a self-control roll (12 or less).

A lively flaw that drives the story forward, and often lands the whole party in trouble.
'''

[[traits]]
id = "skinny"
name = "Skinny"
category = "disadvantage"
cost = -5
page = "B18" # unverified
description = '''
A very thin build. The character looks frail, may have a harder time resisting cold or hardship, and is easy to pick out in a crowd by their lanky figure.

Mostly a matter of appearance and description, but it can give minor penalties in physical situations at the GM's discretion.
'''

[[traits]]
id = "greed-12"
name = "Greed (12)"
category = "disadvantage"
cost = -15
page = "B137" # unverified
description = '''
The character craves money and valuables. When a profitable opportunity appears, even a shady one, they must make a self-control roll (12 or less) to pass it up.

Classic for mercenaries, merchants and treasure hunters; it can easily turn allies into rivals over the loot.
'''

[[traits]]
id = "impulsiveness-12"
name = "Impulsiveness (12)"
category = "disadvantage"
cost = -10
page = "B139" # unverified
description = '''
The character hates waiting and planning; they prefer to act now and think later. When others want to discuss things, a self-control roll (12 or less) is needed to hold back from jumping in.

Makes scenes fast and chaotic. Works well alongside a cautious companion who keeps trying to stop them.
'''

# --- Talents ---

[[traits]]
id = "outdoorsman"
name = "Outdoorsman"
category = "advantage"
cost_per_level = 10
max_levels = 4
page = "B90" # unverified
features = [{ type = "skill_bonus", skills = ["camouflage", "fishing", "mimicry", "naturalist", "navigation", "survival", "tracking", "weather-sense"], amount = 1, per_level = true }]
description = '''
A natural feel for the wilderness. Each level adds +1 to a group of outdoor skills: camouflage, fishing, mimicry, naturalist, navigation, survival, tracking and weather sense. The bonus is applied automatically to those skills on the sheet.

It suits rangers, hunters and anyone raised far from towns. A talent is usually cheaper than raising every one of those skills separately if the character uses several of them.
'''
