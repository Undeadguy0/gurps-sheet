[package]
name = "gurps-library"
description = "Catalog for the editor: read-only from the shared GURPS SurrealDB (via gurps-db)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
gurps-core.workspace = true
gurps-db.workspace = true
sheet-bridge.workspace = true
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
gurps-db = { workspace = true, features = ["testkit"] }
gurps-io.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }