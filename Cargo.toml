[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
default-members = ["crates/*", "src-tauri"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Undeadguy <MikhailBunto@yandex.ru>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
gurps-core = { path = "crates/gurps-core" }
gurps-rules = { path = "crates/gurps-rules" }
gurps-plugins = { path = "crates/gurps-plugins" }
gurps-io = { path = "crates/gurps-io" }
