[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]
default-members = ["crates/*", "src-tauri"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Undeadguy <MikhailBunto@yandex.ru>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
gurps-core = { path = "crates/gurps-core" }
gurps-dice = { path = "crates/gurps-dice" }
gurps-io = { path = "crates/gurps-io" }
gurps-library = { path = "crates/gurps-library" }
# Общий слой БД и проекция каталога — из репозитория gurps-mcp (см. README, раздел «Зависимость от gurps-mcp»).
# Локальная разработка поверх соседнего checkout'а — через [patch] в .cargo/config.toml (не коммитится).
gurps-db = { git = "https://github.com/Undeadguy0/gurps-mcp", branch = "main" }
sheet-bridge = { git = "https://github.com/Undeadguy0/gurps-mcp", branch = "main" }
