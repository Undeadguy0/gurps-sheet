<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GURPS Sheet</title>
    <script>
      // apply persisted theme before first paint
      try {
        var t = localStorage.getItem('gurps.theme'); if (t) document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('gurps.scheme'); if (s) document.documentElement.dataset.scheme = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
